<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#122038" />
    <meta name="color-scheme" content="light" />
    <!--
      Google Fonts (URLs generated by src/lib/fonts.ts; fonts.test.ts keeps them in sync).
      - Preconnect to both origins so the TLS handshakes start immediately.
      - display=swap: text renders at once in a fallback face, then swaps.
      - Shippori Mincho is requested with text= so only the glyphs we use download.
      - media="print" + onload: the stylesheets load without blocking first paint
        (Lighthouse's top finding on mobile); <noscript> keeps them for no-JS readers.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&amp;display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&amp;display=swap&amp;text=%20!%22%23%24%25%26'()*%2B%2C-.%2F0123456789%3A%3B%3C%3D%3E%3F%40ABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5C%5D%5E_%60abcdefghijklmnopqrstuvwxyz%7B%7C%7D~%C2%B7%C3%81%C3%89%C3%8D%C3%93%C3%9A%C3%A0%C3%A1%C3%A2%C3%A4%C3%A7%C3%A8%C3%A9%C3%AA%C3%AB%C3%AD%C3%AE%C3%AF%C3%B1%C3%B3%C3%B4%C3%B6%C3%BA%C3%BB%C3%BC%C4%92%C4%93%E2%80%93%E2%80%94%E2%80%98%E2%80%99%E2%80%9C%E2%80%9D%E2%80%A6%E3%81%A8%E3%81%AE%E4%B8%96%E5%BF%B5%E6%80%9D%E7%95%8C%E7%B4%A2%E7%B7%A8%E8%80%83%E8%A6%B3%E8%AB%96%E9%9B%86"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&amp;display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&amp;display=swap&amp;text=%20!%22%23%24%25%26'()*%2B%2C-.%2F0123456789%3A%3B%3C%3D%3E%3F%40ABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5C%5D%5E_%60abcdefghijklmnopqrstuvwxyz%7B%7C%7D~%C2%B7%C3%81%C3%89%C3%8D%C3%93%C3%9A%C3%A0%C3%A1%C3%A2%C3%A4%C3%A7%C3%A8%C3%A9%C3%AA%C3%AB%C3%AD%C3%AE%C3%AF%C3%B1%C3%B3%C3%B4%C3%B6%C3%BA%C3%BB%C3%BC%C4%92%C4%93%E2%80%93%E2%80%94%E2%80%98%E2%80%99%E2%80%9C%E2%80%9D%E2%80%A6%E3%81%A8%E3%81%AE%E4%B8%96%E5%BF%B5%E6%80%9D%E7%95%8C%E7%B4%A2%E7%B7%A8%E8%80%83%E8%A6%B3%E8%AB%96%E9%9B%86"
      />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
